<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECODE · Stations</title>
<style>
@font-face{font-family:S;src:url(../../../fonts/switzer-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:S;src:url(../../../fonts/switzer-latin-500-normal.woff2) format("woff2");font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0F0E0E;--fg:#F2F1EE;--mute:rgba(242,241,238,.55);--line:rgba(242,241,238,.14);--acc:#FF5A3C}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:S,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.caps{text-transform:uppercase;letter-spacing:.02em;font-weight:500;font-size:11px}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.top,.bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(14px,2.4vw,26px);flex:none;z-index:3}
.top .hint{color:var(--mute);text-align:right}
.stage{position:relative;flex:1;min-height:0;touch-action:none}
.stage canvas.main{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{display:inline-flex;align-items:center;gap:9px;color:var(--mute)}
.scan i{width:7px;height:7px;background:var(--acc);box-shadow:0 0 0 3px rgba(255,90,60,.18);animation:blink 1.4s steps(1) infinite}
.scan.ok{color:var(--fg)}
.scan.ok i{background:var(--fg);box-shadow:0 0 0 3px rgba(242,241,238,.18);animation:none}
@keyframes blink{50%{opacity:0}}
.btn{appearance:none;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:2px;padding:8px 12px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.btn:hover,.btn:focus-visible{border-color:var(--fg);outline:0}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.solid:hover{background:transparent;color:var(--fg)}
.btn[disabled]{opacity:.35;pointer-events:none}
/* unlocked card */
.done{position:absolute;left:50%;bottom:clamp(12px,3vh,26px);transform:translate(-50%,24px);width:min(460px,calc(100% - 28px));background:rgba(15,14,14,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:4px;padding:16px 18px;opacity:0;pointer-events:none;transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1);z-index:5}
.done.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media (min-aspect-ratio:1/1){.done{left:auto;right:clamp(14px,2.4vw,26px);bottom:auto;top:46px;width:min(340px,40%);transform:translateY(-12px)}.done.on{transform:none}.done h3{font-size:18px}.done p{font-size:12.5px}}
.done .k{display:flex;align-items:center;gap:8px;color:var(--mute)}
.done .k::before{content:"";width:7px;height:7px;background:var(--fg)}
.done h3{font-weight:500;font-size:20px;letter-spacing:-.01em;margin:8px 0 6px}

.done .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.done .web{display:inline-block;margin-top:10px;color:#00FFAE;font-size:10px}
/* station 3 key */
.key{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;width:min(240px,46%);height:52px;border:1px solid rgba(242,241,238,.5);border-bottom-width:4px;border-radius:6px;background:#1a1919;color:var(--fg);cursor:pointer;transition:transform .06s,border-bottom-width .06s;left:50%;bottom:16px;transform:translateX(-50%)}
.key.down{transform:translateX(-50%) translateY(3px);border-bottom-width:1px}
/* station 4 */
.cand{position:absolute;cursor:grab;touch-action:none;transition:opacity .3s}
.cand canvas{display:block;width:100%;height:100%}
.cand.used{opacity:.18;pointer-events:none}
.float{position:absolute;z-index:6;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.float canvas{display:block;width:100%;height:100%}
.float.back{transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s,height .45s,opacity .45s}

.float.no{animation:no .4s}
@keyframes no{20%{margin-left:-8px}40%{margin-left:7px}60%{margin-left:-5px}80%{margin-left:3px}}
/* station 5 pad */
.pad{position:absolute;right:14px;bottom:14px;z-index:4;display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px);gap:4px}

.pad button:active{background:var(--fg);color:var(--bg)}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
/* station 6 */
.s6{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,1fr);gap:clamp(12px,2vw,24px);padding:0 clamp(14px,2.4vw,26px) clamp(14px,2.4vw,26px)}
.s6 .view{position:relative;min-height:0}
.s6 .view canvas{position:absolute;inset:0;width:100%;height:100%}
.s6 .card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;padding:clamp(14px,2vw,22px);min-height:0}
.s6 .card .n{color:var(--mute)}
.s6 .card h2{font-weight:500;font-size:clamp(18px,2.2vw,26px);letter-spacing:-.02em;line-height:1.1;margin:10px 0 10px}
.s6 .card p{font-size:13.5px;line-height:1.55;color:rgba(242,241,238,.82)}

.s6 .card li{padding-left:14px;position:relative;margin-top:4px}
.s6 .card li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;background:var(--acc)}
.s6 .card .out{margin-top:14px;display:none;font-size:13px;word-break:break-all}
.s6 .card .out a{color:var(--fg);border-bottom:1px solid var(--fg)}
.s6 .card .out.on{display:block}
.s6 .dots{display:flex;gap:5px;margin-top:auto;padding-top:14px}
.s6 .dots i{flex:1;height:2px;background:var(--line)}
.s6 .dots i.on{background:var(--fg)}
.s6 .ctl{display:flex;gap:8px;margin-top:12px}
.s6 .ctl .btn:last-child{margin-left:auto}
@media (max-aspect-ratio:1/1){
  .top{flex-direction:column;align-items:flex-start;gap:4px}.top .hint{text-align:left}
  .s6{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .s6 .card{padding:14px}.s6 .card h2{margin:6px 0}.s6 .card ul{display:none}.s6 .card p{font-size:12.5px}
}
</style>

<body>
<div class="app">
  <div class="top"><span class="caps" id="ttl"></span><span class="caps hint" id="hint"></span></div>
  <div class="stage" id="stage"><canvas class="main" id="cv"></canvas></div>
  <div class="bot"><span class="scan caps" id="scan"><i></i><span>Scanner · searching</span></span><button class="btn caps" id="reset" type="button">Reset</button></div>
  <div class="done" id="done"><span class="k caps">Unlocked</span><h3 id="dT"></h3><p id="dP"></p><div class="row" id="dR"></div></div>
</div>
<script src="jsqr.min.js"></script>
<script src="qr.js"></script>
<script>
(() => {
'use strict';
const S = Math.min(6, Math.max(1, +(new URLSearchParams(location.search).get('s')) || 1));
const INK = '#0F0E0E', PAPER = '#F2F1EE', FG = '#F2F1EE', ACC = '#FF5A3C', FONT = 'S, system-ui, sans-serif';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const MAIN = QR.main.m, N = MAIN.length;
let W = 0, H = 0, DPR = 1, portrait = false, dirty = true;
const NAMES = ['', 'Contrast', 'Error Correction', 'White Space', 'Uniqueness', 'Universality', 'Digital Eyes'];
$('ttl').textContent = 'Station 0' + S + ' · ' + NAMES[S];

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const finderZone = (i, j, n) => (i < 8 && j < 8) || (i >= n - 8 && j < 8) || (i < 8 && j >= n - 8);
function drawQR(g, m, x, y, s, skip, color) {
  g.fillStyle = color || INK;
  for (let j = 0; j < m.length; j++) for (let i = 0; i < m.length; i++)
    if (m[j][i] === '1' && !(skip && skip(i, j))) g.fillRect(x + i * s, y + j * s, s, s);
}
function finder(g, x, y, s, color) {
  g.fillStyle = color || INK; g.beginPath();
  g.rect(x, y, 7 * s, 7 * s); g.rect(x + s, y + s, 5 * s, 5 * s); g.fill('evenodd');
  g.fillRect(x + 2 * s, y + 2 * s, 3 * s, 3 * s);
}
function finders(g, x, y, s, n, color) { finder(g, x, y, s, color); finder(g, x + (n - 7) * s, y, s, color); finder(g, x, y + (n - 7) * s, s, color); }
const scanCanvas = document.createElement('canvas'), sctx = scanCanvas.getContext('2d', { willReadFrequently: true });
function decode(src, sx, sy, sw, sh, invert) {
  // run a real QR decoder (jsQR) over a region of a canvas
  sw = Math.round(sw); sh = Math.round(sh);
  if (sw < 20 || sh < 20) return null;
  const k = Math.min(1, 520 / Math.max(sw, sh));
  scanCanvas.width = Math.round(sw * k); scanCanvas.height = Math.round(sh * k);
  sctx.imageSmoothingEnabled = true;
  sctx.drawImage(src, sx, sy, sw, sh, 0, 0, scanCanvas.width, scanCanvas.height);
  const d = sctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
  const r = jsQR(d.data, d.width, d.height, { inversionAttempts: invert ? 'attemptBoth' : 'dontInvert' });
  return r ? r.data : null;
}
const scanEl = $('scan'), scanTxt = scanEl.querySelector('span');
function status(txt, ok) { scanTxt.textContent = txt; scanEl.classList.toggle('ok', !!ok); }
const done = $('done');
// finishing a station unlocks its page on the DECODE website (same origin, shared storage)
const WEB = ['one', 'two', 'three', 'four', 'five', 'six', 'seven'];
function unlockWeb() {
  try {
    const k = 'decode-unlocked', a = JSON.parse(localStorage.getItem(k) || '[]'), n = WEB[S - 1];
    if (!a.includes(n)) { a.push(n); localStorage.setItem(k, JSON.stringify(a)); }
  } catch (e) {}
}
function unlock(title, text, extra, final) {
  $('dT').textContent = title; $('dP').textContent = text;
  if (final !== false) { unlockWeb(); const w = document.createElement('span'); w.className = 'web caps'; w.textContent = 'Page ' + WEB[S - 1] + ' of the DECODE website is now unlocked'; $('dP').appendChild(document.createElement('br')); $('dP').appendChild(w); }
  const row = $('dR'); row.innerHTML = '';
  (extra || []).forEach(b => row.appendChild(b));
  const again = document.createElement('button'); again.className = 'btn caps'; again.type = 'button'; again.textContent = 'Play again';
  again.onclick = () => { hideDone(); st.reset(); }; row.appendChild(again);
  const close = document.createElement('button'); close.className = 'btn caps'; close.type = 'button'; close.textContent = 'Close';
  close.onclick = hideDone; row.appendChild(close);
  done.classList.add('on');
}
const hideDone = () => done.classList.remove('on');
$('reset').onclick = () => { hideDone(); st.reset(); dirty = true; };

// pixel fireworks (same square-pixel language as the site)
const sparks = [];
function burst(x, y, count) {
  for (let q = 0; q < count; q++) {
    const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 5;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, life: 1, s: 2 + Math.random() * 3, c: Math.random() < 0.3 ? ACC : null });
  }
}
function drawSparks(g, dt, base) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.vy += 0.12 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= 0.018 * dt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    g.globalAlpha = Math.round(p.life * 5) / 5; g.fillStyle = p.c || base;
    g.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  g.globalAlpha = 1;
}

function fit() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = stage.getBoundingClientRect(); W = r.width; H = r.height; portrait = W < H * 0.95;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  st.resize && st.resize(); dirty = true;
}
function text(g, str, x, y, align, color, size) {
  g.font = '500 ' + (size || 11) + 'px ' + FONT; g.textAlign = align || 'left'; g.textBaseline = 'middle';
  g.fillStyle = color || 'rgba(242,241,238,.55)'; g.fillText(str.toUpperCase(), x, y);
}

// ================= STATION 1 · CONTRAST =================
// Slide the engraved acrylic over five backgrounds; a real decoder reads whatever is under it.
function station1() {
  const BG = [
    { name: 'Paper', base: [236, 232, 224], grain: 10 },
    { name: 'Halftone', base: [244, 242, 238], dots: true },
    { name: 'Kraft', base: [200, 162, 120], grain: 26, stripes: true },
    { name: 'Felt grey', base: [184, 183, 180], grain: 22 },
    { name: 'Black', base: [20, 20, 20], grain: 8 },
  ];
  // landscape: the acrylic slides along the whole tray. portrait: the acrylic stays put in a window
  // and the (much wider) strip of backgrounds slides underneath it, like the physical slider.
  let tray, A, ms, pw, len, pos = 0.06, strip = null, scanned = false, found = '', lastScan = 0, moved = true, okTime = 0;
  function paintStrip() {
    strip = document.createElement('canvas');
    strip.width = Math.round(len * DPR); strip.height = Math.round(tray.h * DPR);
    const g = strip.getContext('2d'), n = BG.length;
    for (let b = 0; b < n; b++) {
      const bg = BG[b], x0 = Math.round(b * strip.width / n), w = Math.round((b + 1) * strip.width / n) - x0, h = strip.height;
      const img = g.createImageData(w, h), d = img.data;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const p = (y * w + x) * 4;
        let v = bg.grain ? (Math.random() - 0.5) * bg.grain : 0;
        if (bg.stripes) v += Math.sin((x * 0.05 + Math.sin(y * 0.02) * 3)) * 9;
        d[p] = bg.base[0] + v; d[p + 1] = bg.base[1] + v; d[p + 2] = bg.base[2] + v; d[p + 3] = 255;
      }
      g.putImageData(img, x0, 0);
      if (bg.dots) {
        g.save(); g.beginPath(); g.rect(x0, 0, w, h); g.clip();
        const step = Math.max(5, ms * DPR * 1.1); g.fillStyle = '#1b1b1b';
        for (let y = 0; y < h + step; y += step) for (let x = x0 + ((y / step) % 2 ? step / 2 : 0); x < x0 + w + step; x += step) { g.beginPath(); g.arc(x, y, step * 0.32, 0, 7); g.fill(); }
        g.restore();
      }
    }
  }
  const off = () => portrait ? pw / 2 + pos * 4 * pw - tray.w / 2 : 0;
  const center = () => portrait ? { x: tray.x + tray.w / 2, y: tray.y + tray.h / 2 } : { x: tray.x + A / 2 + pos * (tray.w - A), y: tray.y + tray.h / 2 };
  const st = {
    resize() {
      if (portrait) {
        A = Math.min(W * 0.6, H * 0.42); pw = A * 1.5; len = pw * 5;
        const w = W - 24, h = A * 1.3; tray = { x: 12, y: (H - h) / 2 - 12, w, h };
      } else {
        const w = Math.min(W * 0.9, 1100), h = Math.min(H * 0.62, w / 5 * 1.15); tray = { x: (W - w) / 2, y: (H - h) / 2 - 8, w, h };
        A = Math.min(h * 0.9, w / 5 * 1.25); pw = w / 5; len = w;
      }
      ms = Math.max(2, Math.floor(A * 0.74 / N));
      $('hint').textContent = portrait ? 'Drag sideways to slide the backgrounds' : 'Drag the acrylic along the slider';
      paintStrip(); moved = true;
    },
    reset() { pos = 0.06; scanned = false; found = ''; okTime = 0; moved = true; status('Scanner · searching'); },
    move(p) { pos = clamp(p, 0, 1); moved = true; dirty = true; },
    draw(now) {
      ctx.clearRect(0, 0, W, H);
      const pad = 12, o = off();
      ctx.fillStyle = '#E4E2DD'; ctx.beginPath(); ctx.roundRect(tray.x - (portrait ? 6 : pad), tray.y - pad, tray.w + (portrait ? 12 : pad * 2), tray.h + pad * 2, 14); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.rect(tray.x, tray.y, tray.w, tray.h); ctx.clip();
      ctx.drawImage(strip, tray.x - o, tray.y, len, tray.h);
      ctx.restore();
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.strokeRect(tray.x + .5, tray.y + .5, tray.w - 1, tray.h - 1);
      BG.forEach((bg, b) => {
        const lx = tray.x - o + (b + 0.5) * pw;
        if (lx < tray.x - 20 || lx > tray.x + tray.w + 20) return;
        text(ctx, bg.name, lx, tray.y + tray.h + pad + 16, 'center', 'rgba(242,241,238,.5)', 10);
      });
      if (portrait) { // progress ticks along the bottom
        const tw = Math.min(180, W * 0.5), tx = W / 2 - tw / 2, ty = tray.y + tray.h + pad + 40;
        ctx.fillStyle = 'rgba(242,241,238,.15)'; ctx.fillRect(tx, ty, tw, 2);
        ctx.fillStyle = FG; ctx.fillRect(tx + pos * (tw - 24), ty - 1, 24, 4);
      }
      const c = center(), x = c.x - A / 2, y = c.y - A / 2;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.roundRect(x, y, A, A, 10); ctx.fill(); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x + .75, y + .75, A - 1.5, A - 1.5, 10); ctx.stroke();
      const q = N * ms, qx = Math.round(c.x - q / 2), qy = Math.round(c.y - q / 2);
      drawQR(ctx, MAIN, qx, qy, ms, null, 'rgba(255,255,255,.45)');
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      for (let k = -1; k <= 1; k++) ctx.fillRect(c.x + k * 5 - 1, y + A - 9, 2, 5);
      if (moved && now - lastScan > 160) {
        lastScan = now; moved = false;
        const r = decode(cv, x * DPR, y * DPR, A * DPR, A * DPR, true);
        const bi = clamp(Math.floor((c.x - tray.x + o) / pw), 0, 4);
        if (r) { found = BG[bi].name; status('Scanned · ' + r.replace('https://', ''), true); if (!okTime) okTime = now; }
        else { okTime = 0; if (!scanned) status('Scanner · ' + BG[bi].name + ' · no read'); }
      }
      if (okTime && !scanned && now - okTime > 450) {
        scanned = true;
        unlock('Contrast', 'It read on ' + found + '. A scanner only sees the difference between dark and light. Engraving on clear acrylic is pale, so it needs a dark surface behind it to stand out.');
      }
      if (okTime) { ctx.strokeStyle = FG; ctx.lineWidth = 2; ctx.strokeRect(x - 5, y - 5, A + 10, A + 10); }
    },
  };
  let drag = null;
  const rel = e => { const r = stage.getBoundingClientRect(); return e.clientX - r.left; };
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    drag = { x: rel(e), pos };
    if (!portrait) st.move((rel(e) - tray.x - A / 2) / (tray.w - A));
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    if (portrait) st.move(drag.pos - (rel(e) - drag.x) / (4 * pw)); // drag the strip: it follows your finger
    else st.move((rel(e) - tray.x - A / 2) / (tray.w - A));
  });
  addEventListener('pointerup', () => drag = null);
  addEventListener('keydown', e => { const d = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key]; if (d) { st.move(pos + d * 0.05); e.preventDefault(); } });
  st.always = true;
  return st;
}

// ================= STATION 2 · ERROR CORRECTION =================
// Scratch off the grey layer. The decoder tries after every stroke.
function station2() {
  let s, q, x0, y0, mask, mg, scanned = false, pct = 0, need = true, lastScan = 0, readAt = -1;
  // where each codeword sits (version 4-H: 4 blocks of 9 data + 16 error-correction codewords, interleaved)
  const isFunc = (x, y) => (x <= 8 && y <= 8) || (x >= N - 8 && y <= 8) || (x <= 8 && y >= N - 8) || x === 6 || y === 6 || (x >= 24 && x <= 28 && y >= 24 && y <= 28);
  const order = [];
  for (let right = N - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
